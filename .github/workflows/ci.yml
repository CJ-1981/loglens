name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check test_loglens.js
          node --check test_loglens_v15.js
          node --check perf_loglens.js

      - name: Engine + regression tests
        run: node test_loglens.js

      - name: v1.5 spec suite
        run: node test_loglens_v15.js

      - name: Throughput smoke (informational)
        run: node perf_loglens.js

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run E2E (real browser)
        run: node e2e/loglens.e2e.js
